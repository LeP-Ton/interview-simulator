name: 验证面试模拟器构建

on:
  push:
    branches: [main]
    paths:
      - interview-simulator/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interview-simulator
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interview-simulator/package-lock.json

      - name: 安装锁定版本依赖
        run: npm ci

      - name: 运行核心测试
        run: npm test

      - name: 类型检查与生产构建
        run: npm run build

      - name: 保存网站构建产物
        uses: actions/upload-artifact@v4
        with:
          name: interview-simulator-web
          path: interview-simulator/dist
          retention-days: 7
