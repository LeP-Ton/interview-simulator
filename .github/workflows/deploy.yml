name: 构建与发布 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - interview-simulator/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: interview-simulator
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interview-simulator/package-lock.json

      - name: 安装锁定版本依赖
        run: npm ci

      - name: 运行核心测试
        run: npm test

      - name: 类型检查与生产构建
        run: npm run build

      - name: 读取 Pages 配置
        uses: actions/configure-pages@v5

      - name: 上传网页构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: interview-simulator/dist

  deploy:
    name: 发布游戏
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
